# felhaven_sinks.yml: a semgrep taint rule that traces a value from the
# network, a config or environment read, or an LLM-facing tool argument into a
# process launch or an OS opener.
#
# A TRIPWIRE, NOT A PROOF. Open-source semgrep follows taint inside one
# function at a time, so a value that passes through a helper before reaching
# the launch is missed. tests/test_process_launches.py is the gate (it runs in
# CI and lists every launch with its argument sources); this rule is run BY
# HAND, when that guard reports a new launch and at each security review, to
# catch an argument whose source changed inside a launch that is already
# listed. Why it is not in CI: CONVENTIONS §12.
#
# The sinks between the BEGIN and END markers are generated from the guard's
# own list of launchers, and the guard fails if they differ. Edit the guard,
# then paste the block its failure message prints.
#
# How to run (PowerShell, from metis_toolbox\). semgrep gets a venv of its own
# outside the repo, never .venv (test_environment_lock fails on any package the
# lock doesn't name), and --metrics=off, since semgrep can otherwise report
# usage:
#   py -3.13 -m venv "$HOME\semgrep-venv"
#   & "$HOME\semgrep-venv\Scripts\pip.exe" install semgrep==1.178.0
#   &"$HOME\semgrep-venv\Scripts\semgrep.exe" scan --metrics=off --disable-version-check --config tests\semgrep\felhaven_sinks.yml --exclude tests --exclude sandbox .
# and the rule's own test (felhaven_sinks.py holds the cases):
#   & "$HOME\semgrep-venv\Scripts\semgrep.exe" scan --metrics=off --disable-version-check --test tests\semgrep
#
# Known hits, each reviewed (their lines in tests/test_process_launches.py say
# why they are safe): PhemePanel._build_story_row._open, morpheus.search,
# morpheus.describe. Anything else is new: trace it before trusting it.
rules:
  - id: felhaven-untrusted-into-process-or-opener
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      Value from the network, a config/env read, or an LLM-facing tool
      argument reaches a process launch / OS opener. Check it cannot start
      with '-' (option injection) or name an unexpected program/path.
    pattern-sources:
      # network: every runtime read goes through hermes; Callimachus's own
      # opener and Pythia's Ollama stream are the two that read for themselves
      - pattern: hermes.get(...)
      - pattern: hermes.read_bounded(...)
      - pattern: requests.get(...)
      - pattern: requests.post(...)
      - pattern: urllib.request.urlopen(...)
      - pattern: $OPENER.open(...)
      # what another program printed. Matched as `proc.stdout` after
      # `proc = subprocess.run(...)`, the form the code uses: the chained form
      # `subprocess.run(...).stdout` never matches it, and it contains a sink,
      # so semgrep reported every such call against itself.
      - patterns:
          - pattern-inside: |
              $PROC = subprocess.run(...)
              ...
          - pattern: $PROC.stdout
      # config / environment
      - pattern: json.load(...)
      - pattern: json.loads(...)
      - pattern: os.environ.get(...)
      - pattern: os.environ[...]
      # LLM-facing tool handlers and the functions they hand off to
      - patterns:
          - pattern-inside: |
              def $FUNC(..., $ARG, ...):
                ...
          - metavariable-regex:
              metavariable: $FUNC
              regex: ^(handle|_dispatch|search|describe|play|play_music|fetch_page|search_web|write_document|edit_document|read_document|_guarded_play_music|synthesize|speak)$
          - focus-metavariable: $ARG
    pattern-sinks:
      # BEGIN sinks, generated by tests/test_process_launches.py
      - pattern: asyncio.create_subprocess_exec(...)
      - pattern: asyncio.create_subprocess_shell(...)
      - pattern: os.execl(...)
      - pattern: os.execle(...)
      - pattern: os.execlp(...)
      - pattern: os.execlpe(...)
      - pattern: os.execv(...)
      - pattern: os.execve(...)
      - pattern: os.execvp(...)
      - pattern: os.execvpe(...)
      - pattern: os.popen(...)
      - pattern: os.posix_spawn(...)
      - pattern: os.posix_spawnp(...)
      - pattern: os.spawnl(...)
      - pattern: os.spawnle(...)
      - pattern: os.spawnlp(...)
      - pattern: os.spawnlpe(...)
      - pattern: os.spawnv(...)
      - pattern: os.spawnve(...)
      - pattern: os.spawnvp(...)
      - pattern: os.spawnvpe(...)
      - pattern: os.startfile(...)
      - pattern: os.system(...)
      - pattern: pty.spawn(...)
      - pattern: subprocess.Popen(...)
      - pattern: subprocess.call(...)
      - pattern: subprocess.check_call(...)
      - pattern: subprocess.check_output(...)
      - pattern: subprocess.getoutput(...)
      - pattern: subprocess.getstatusoutput(...)
      - pattern: subprocess.run(...)
      - pattern: webbrowser.open(...)
      - pattern: webbrowser.open_new(...)
      - pattern: webbrowser.open_new_tab(...)
      - patterns:
          - pattern-either:
              - pattern: $LIB.$FN(...)
              - pattern: $FN(...)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(CreateProcessA|CreateProcessAsUserW|CreateProcessW|CreateProcessWithLogonW|CreateProcessWithTokenW|SHFileOperationA|SHFileOperationW|ShellExecuteA|ShellExecuteExA|ShellExecuteExW|ShellExecuteW|WinExec)$
      - pattern: $TK.call("exec", ...)
      - pattern: $TK.eval(...)
      # END sinks
